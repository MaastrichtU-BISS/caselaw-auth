<!doctype html>
<html class="login-pf" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigiMach authentication theme preview</title>
    <link rel="stylesheet" href="../caselaw/login/resources/css/caselaw-login-v8.css" />
    <link rel="stylesheet" href="login/resources/css/digimach-login-v1.css" />
  </head>
  <body>
    <main class="login-pf-page">
      <section class="card-pf" aria-labelledby="kc-page-title">
        <header class="login-pf-header">
          <h1 id="kc-page-title">Sign in to DigiMach</h1>
          <p class="cle-auth-intro">Use your account to continue to the DigiMach platform.</p>
        </header>

        <div id="kc-content">
          <div id="kc-content-wrapper">
            <form id="kc-form" action="#" method="post">
              <div class="form-group">
                <label for="username">Email address</label>
                <input id="username" class="form-control" type="email" value="alex@example.com" />
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input id="password" class="form-control" type="password" value="password" />
              </div>
              <div id="kc-form-options">
                <label class="checkbox"><input type="checkbox" /> Remember me</label>
                <a href="#">Forgot password?</a>
              </div>
              <div id="kc-form-buttons">
                <input id="kc-login" class="btn btn-primary" type="submit" value="Sign in" />
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="cle-login-footer" aria-label="Related links">
      <p>Authentication managed by BISS Institute</p>
      <nav aria-label="Institution and product links">
        <a href="https://digimach.eu/">DigiMach</a>
        <a href="https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society">BISS Institute</a>
      </nav>
    </footer>
  </body>
</html>
