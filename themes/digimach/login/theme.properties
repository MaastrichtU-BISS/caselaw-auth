# DigiMach reuses the complete Case Law login implementation (including the
# passwordless OTP template, messages, footer and input script), then applies a
# small brand layer of its own. Keeping the shared stylesheet first means new
# Keycloak-state coverage added to caselaw is inherited automatically.
parent=caselaw
favicons=img/digimach-mark.svg
styles=css/caselaw-login-v10.css css/digimach-login-v1.css
scripts=js/otp-input-v1.js

footerManagedBy=${env.DIGIMACH_AUTH_FOOTER_MANAGED_BY:Authentication managed by BISS Institute}
footerBissLabel=${env.DIGIMACH_AUTH_FOOTER_PRODUCT_LABEL:DigiMach}
footerBissUrl=${env.DIGIMACH_AUTH_FOOTER_PRODUCT_URL:https://digimach.eu/}
footerLawTechLabel=${env.DIGIMACH_AUTH_FOOTER_BISS_LABEL:BISS Institute}
footerLawTechUrl=${env.DIGIMACH_AUTH_FOOTER_BISS_URL:https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society}
footerApiLabel=
footerApiUrl=

# DigiMach's own documents. They must be set here, or the Case Law Explorer
# documents would be inherited from the parent theme. DigiMach has no separate
# cookie policy; its privacy policy covers cookies.
legalTermsUrl=${env.DIGIMACH_AUTH_TERMS_URL:https://digimach.eu/en/terms-of-service}
legalPrivacyUrl=${env.DIGIMACH_AUTH_PRIVACY_URL:https://digimach.eu/en/privacy-policy}
legalCookiesUrl=${env.DIGIMACH_AUTH_COOKIES_URL:}
