<!DOCTYPE html>
<html class="login-pf" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

            <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Bizzy authentication theme preview</title>
        <link rel="icon" type="image/svg+xml" href="login/resources/img/bizzy-favicon-v4.svg" />
        <link href="https://auth.caselawexplorer.tech/resources/3962h/common/keycloak/vendor/patternfly-v4/patternfly.min.css" rel="stylesheet" />
        <link href="https://auth.caselawexplorer.tech/resources/3962h/common/keycloak/vendor/patternfly-v3/css/patternfly.min.css" rel="stylesheet" />
        <link href="https://auth.caselawexplorer.tech/resources/3962h/common/keycloak/vendor/patternfly-v3/css/patternfly-additions.min.css" rel="stylesheet" />
        <link href="https://auth.caselawexplorer.tech/resources/3962h/common/keycloak/lib/pficon/pficon.css" rel="stylesheet" />
        <link href="../caselaw/login/resources/css/caselaw-login-v10.css" rel="stylesheet" /><link href="login/resources/css/bizzy-login-v2.css" rel="stylesheet" />
        
    </head>

<body class="" data-page-id="login-login-username">
<div class="login-pf-page">
    <div id="kc-header" class="login-pf-page-header">
        <div id="kc-header-wrapper"
             class="">Bizzy</div>
    </div>
    <div class="card-pf">
        <header class="login-pf-header">
                <h1 id="kc-page-title">        Sign in to Bizzy

</h1>
      </header>
      <div id="kc-content">
        <div id="kc-content-wrapper">


        <div id="kc-form">
            <div id="kc-form-wrapper">
                    <form id="kc-form-login" onsubmit="login.disabled = true; return true;" action="#"
                          method="post">
                            <div class="form-group">
                                <label for="username"
                                       class="pf-c-form__label pf-c-form__label-text">Email</label>

                                <input tabindex="1" id="username"
                                       aria-invalid=""
                                       class="pf-c-form-control" name="username"
                                       value=""
                                       type="text" autofocus
                                       autocomplete="username"
                                       dir="ltr"/>

                            </div>

                        <div class="form-group login-pf-settings">
                            <div id="kc-form-options">
                                    <div class="checkbox">
                                        <label>
                                                <input tabindex="3" id="rememberMe" name="rememberMe"
                                                       type="checkbox"> Remember me
                                        </label>
                                    </div>
                            </div>
                        </div>

                        <div id="kc-form-buttons" class="form-group">
                            <input tabindex="4"
                                   class="pf-c-button pf-m-primary pf-m-block btn-lg"
                                   name="login" id="kc-login" type="submit" value="Sign In"/>
                        </div>
                    </form>
            </div>
        </div>







        </div>
      </div>

    <footer class="cle-login-footer" aria-label="Related links">
        <nav class="cle-login-related" aria-label="Institution and product links">
            <a href="https://app.usebizzy.eu/" target="_blank" rel="noopener noreferrer">Bizzy</a>
        </nav>
        <p class="cle-login-managed">
          Authentication managed by <a href="https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society" target="_blank" rel="noopener noreferrer">BISS Institute</a>
        </p>
    </footer>
    </div>
  </div>
</body>
</html>
