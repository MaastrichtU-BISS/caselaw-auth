# Bizzy (formerly Bizzash) reuses the complete
# Case Law login implementation, including the passwordless OTP template,
# messages, footer and input script, and applies its own brand layer: Bizzy's
# warm light theme, self-hosted Inter and Overpass, and on wide screens a panel
# with Bizzy standing on his blue block.
parent=caselaw
favicons=img/bizzy-favicon-v4.svg
styles=css/caselaw-login-v10.css css/bizzy-login-v2.css
scripts=js/otp-input-v1.js

footerManagedBy=${env.BIZZASH_AUTH_FOOTER_MANAGED_BY:Authentication managed by BISS Institute}
footerBissLabel=${env.BIZZASH_AUTH_FOOTER_PRODUCT_LABEL:Bizzy}
footerBissUrl=${env.BIZZASH_AUTH_FOOTER_PRODUCT_URL:https://app.usebizzy.eu/}
footerLawTechLabel=${env.BIZZASH_AUTH_FOOTER_BISS_LABEL:BISS Institute}
footerLawTechUrl=${env.BIZZASH_AUTH_FOOTER_BISS_URL:https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society}
footerApiLabel=
footerApiUrl=

# Bizzy is a Maastricht University tool without public legal documents of its own.
# Set empty here so the Case Law Explorer documents are not inherited.
legalTermsUrl=${env.BIZZASH_AUTH_TERMS_URL:}
legalPrivacyUrl=${env.BIZZASH_AUTH_PRIVACY_URL:}
legalCookiesUrl=${env.BIZZASH_AUTH_COOKIES_URL:}
