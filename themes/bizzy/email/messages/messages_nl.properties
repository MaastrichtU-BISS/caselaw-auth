# Bizzy's emails (Dutch). Placeholders follow Java MessageFormat: {0} is the
# first value; write apostrophes as ’ (a plain ' would need doubling).
# Codes and links are valid for 10 minutes: the realm's login-action timeout
# (accessCodeLifespanLogin=600) and the magic links' lifespan. Change the
# wording here if the realm ever changes it.

bizzyMadeAt=Gemaakt bij BISS, Universiteit Maastricht
bizzyBiss=Brightlands Institute for Smart Society
bizzyNotExpecting=Had je deze e-mail niet verwacht? Dan kun je hem negeren; er verandert niets.

# The sign-in code (ext-email-otp). Keycloak can't put the code in the subject, so the preview line carries it.
otpSubject=Je inlogcode voor Bizzy
otpPreheader={0} is je code om in te loggen bij Bizzy. Hij werkt 10 minuten.
otpHeading=Je inlogcode
otpIntro=Vul deze code in op de inlogpagina van Bizzy om verder te gaan.
otpValid=10 minuten geldig
otpNotYou=Probeerde je niet in te loggen? Misschien heeft iemand je adres per ongeluk ingevuld. Je kunt deze e-mail negeren: zonder de code kan niemand als jou inloggen.
otpReason=Je krijgt deze e-mail omdat met dit adres een aanmelding bij Bizzy is gestart.
otpBody=Je inlogcode voor Bizzy: {1}\n\nHij werkt 10 minuten. Probeerde je niet in te loggen? Negeer dan deze e-mail.
otpBodyHtml=<p>Je inlogcode voor Bizzy: <b>{1}</b></p><p>Hij werkt 10 minuten. Probeerde je niet in te loggen? Negeer dan deze e-mail.</p>

# The sign-in link (ext-magic-form; off in the passwordless flow, styled in case it is turned on).
magicLinkSubject=Je inloglink voor Bizzy
magicLinkContinuationSubject=Je inloglink voor Bizzy
magicLinkPreheader=Log met \u00e9\u00e9n klik in bij Bizzy. De link werkt \u00e9\u00e9n keer, 10 minuten lang.
magicLinkHeading=Inloggen bij Bizzy
magicLinkIntro=Log in met de knop. De link werkt \u00e9\u00e9n keer, 10 minuten lang.
magicLinkButton=Inloggen bij Bizzy

# An administrator asks for an action (Users -> Credentials -> Send email).
executeActionsSubject=Bizzy: werk je account bij
executeActionsHeading=Werk je Bizzy-account bij
executeActionsIntro=Een beheerder heeft je gevraagd dit te doen in Bizzy: {0}.
executeActionsButton=Verder
executeActionsValid=De link werkt {0}.

emailVerificationSubject=Bevestig je e-mailadres voor Bizzy
emailVerificationHeading=Bevestig je e-mailadres
emailVerificationIntro=Bevestig dat dit adres van jou is om je Bizzy-account af te maken.
emailVerificationButton=Adres bevestigen
emailVerificationValid=De link werkt {0}.
emailVerificationNotYou=Heb je geen Bizzy-account aangevraagd? Dan kun je deze e-mail negeren.

emailUpdateConfirmationSubject=Bevestig je nieuwe e-mailadres voor Bizzy
emailUpdateConfirmationHeading=Bevestig je nieuwe adres
emailUpdateConfirmationIntro=Bevestig {0} als het nieuwe adres van je Bizzy-account.
emailUpdateConfirmationButton=Nieuw adres bevestigen

passwordResetSubject=Stel opnieuw in hoe je inlogt bij Bizzy
passwordResetHeading=Inloggen opnieuw instellen
passwordResetIntro=Iemand heeft gevraagd om opnieuw in te stellen hoe je inlogt bij Bizzy. Was jij dat? Ga dan verder met de knop.
passwordResetButton=Opnieuw instellen

# The SMTP test button in the admin console.
emailTestSubject=Bizzy: test-e-mail
emailTestHeading=E-mail werkt
emailTestIntro=Dit is een test van de inlogdienst van Bizzy. Kun je dit lezen, dan komen inlogcodes ook aan.
emailTestBody=Dit is een test van de inlogdienst van Bizzy. Kun je dit lezen, dan komen inlogcodes ook aan.

# Units for "the link works for …": Keycloak puts the number before them itself
# (the stock Dutch units repeat it: "12 12 uur").
linkExpirationFormatter.timePeriodUnit.seconds={0,choice,0#seconden|1#seconde|1<seconden}
linkExpirationFormatter.timePeriodUnit.minutes={0,choice,0#minuten|1#minuut|1<minuten}
linkExpirationFormatter.timePeriodUnit.hours={0,choice,0#uur|1#uur|1<uur}
linkExpirationFormatter.timePeriodUnit.days={0,choice,0#dagen|1#dag|1<dagen}
