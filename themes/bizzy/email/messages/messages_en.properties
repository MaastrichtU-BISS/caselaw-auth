# Bizzy's emails (English). Placeholders follow Java MessageFormat: {0} is the
# first value; write apostrophes as ’ (a plain ' would need doubling).
# Codes and links are valid for 10 minutes: the realm's login-action timeout
# (accessCodeLifespanLogin=600) and the magic links' lifespan. Change the
# wording here if the realm ever changes it.

bizzyMadeAt=Made at BISS, Maastricht University
bizzyBiss=Brightlands Institute for Smart Society
bizzyNotExpecting=Not expecting this email? You can ignore it; nothing changes.

# The sign-in code (ext-email-otp). Keycloak can't put the code in the subject, so the preview line carries it.
otpSubject=Your Bizzy sign-in code
otpPreheader={0} is your code to sign in to Bizzy. It works for 10 minutes.
otpHeading=Your sign-in code
otpIntro=Enter this code on the Bizzy sign-in page to continue.
otpValid=Valid for 10 minutes
otpNotYou=Didn\u2019t try to sign in? Someone may have typed your address by mistake. You can ignore this email: without the code, nobody can sign in as you.
otpReason=You get this email because a sign-in to Bizzy was started with this address.
otpBody=Your Bizzy sign-in code: {1}\n\nIt works for 10 minutes. If you didn\u2019t try to sign in, ignore this email.
otpBodyHtml=<p>Your Bizzy sign-in code: <b>{1}</b></p><p>It works for 10 minutes. If you didn\u2019t try to sign in, ignore this email.</p>

# The sign-in link (ext-magic-form; off in the passwordless flow, styled in case it is turned on).
magicLinkSubject=Your Bizzy sign-in link
magicLinkContinuationSubject=Your Bizzy sign-in link
magicLinkPreheader=Sign in to Bizzy with one click. The link works once, for 10 minutes.
magicLinkHeading=Sign in to Bizzy
magicLinkIntro=Use the button to sign in. The link works once, for 10 minutes.
magicLinkButton=Sign in to Bizzy

# An administrator asks for an action (Users -> Credentials -> Send email).
executeActionsSubject=Bizzy: please update your account
executeActionsHeading=Update your Bizzy account
executeActionsIntro=An administrator asked you to do the following in Bizzy: {0}.
executeActionsButton=Continue
executeActionsValid=The link works for {0}.

emailVerificationSubject=Confirm your email address for Bizzy
emailVerificationHeading=Confirm your email address
emailVerificationIntro=Confirm that this address is yours to finish setting up your Bizzy account.
emailVerificationButton=Confirm address
emailVerificationValid=The link works for {0}.
emailVerificationNotYou=Didn\u2019t ask for a Bizzy account? You can ignore this email.

emailUpdateConfirmationSubject=Confirm your new email address for Bizzy
emailUpdateConfirmationHeading=Confirm your new address
emailUpdateConfirmationIntro=Confirm {0} as the new address of your Bizzy account.
emailUpdateConfirmationButton=Confirm new address

passwordResetSubject=Reset how you sign in to Bizzy
passwordResetHeading=Reset your sign-in
passwordResetIntro=Someone asked to reset how you sign in to Bizzy. If that was you, continue with the button.
passwordResetButton=Reset sign-in

# The SMTP test button in the admin console.
emailTestSubject=Bizzy: test email
emailTestHeading=Email works
emailTestIntro=This is a test from Bizzy\u2019s sign-in service. If you can read it, sign-in codes will arrive too.
emailTestBody=This is a test from Bizzy\u2019s sign-in service. If you can read it, sign-in codes will arrive too.

# Units for "the link works for …": Keycloak puts the number before them itself.
linkExpirationFormatter.timePeriodUnit.seconds={0,choice,0#seconds|1#second|1<seconds}
linkExpirationFormatter.timePeriodUnit.minutes={0,choice,0#minutes|1#minute|1<minutes}
linkExpirationFormatter.timePeriodUnit.hours={0,choice,0#hours|1#hour|1<hours}
linkExpirationFormatter.timePeriodUnit.days={0,choice,0#days|1#day|1<days}
