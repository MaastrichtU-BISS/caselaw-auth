# Bizzash (BISS success dashboard) reuses the complete Case Law login
# implementation, including the passwordless OTP template, messages, footer and
# input script, and applies its own brand layer: a calm, light split layout in
# BISS blue with Bizzy, the Bizzash assistant, on the left.
parent=caselaw
favicons=img/bizzash-mark-v2.svg
styles=css/caselaw-login-v10.css css/bizzash-login-v1.css
scripts=js/otp-input-v1.js

footerManagedBy=${env.BIZZASH_AUTH_FOOTER_MANAGED_BY:Authentication managed by BISS Institute}
footerBissLabel=${env.BIZZASH_AUTH_FOOTER_PRODUCT_LABEL:Bizzash}
footerBissUrl=${env.BIZZASH_AUTH_FOOTER_PRODUCT_URL:https://bizzash.biss-institute.com/}
footerLawTechLabel=${env.BIZZASH_AUTH_FOOTER_BISS_LABEL:BISS Institute}
footerLawTechUrl=${env.BIZZASH_AUTH_FOOTER_BISS_URL:https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society}
footerApiLabel=
footerApiUrl=

# Bizzash is an internal BISS tool without public legal documents of its own.
# Set empty here so the Case Law Explorer documents are not inherited.
legalTermsUrl=${env.BIZZASH_AUTH_TERMS_URL:}
legalPrivacyUrl=${env.BIZZASH_AUTH_PRIVACY_URL:}
legalCookiesUrl=${env.BIZZASH_AUTH_COOKIES_URL:}
