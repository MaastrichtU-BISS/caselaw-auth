# Bizzy's emails: the sign-in code first, then every other email the realm can
# send, on one layout shared with the Bizzy app's own emails (invitations,
# notifications; server/lib/email/layout.ts there). HTML and plain text, English
# and Dutch. Select it under Realm settings -> Themes -> Email theme.
parent=base
locales=en,nl

# The logo picture next to the word BIZZY in the header. Served by the Bizzy app
# (public/brand); emails read fine with pictures blocked, since BIZZY is live text.
# Set it empty to send no picture at all.
emailLogoUrl=${env.BIZZASH_EMAIL_LOGO_URL:https://bizzy.biss-institute.com/brand/bizzy-mark-56.png}
emailProductUrl=${env.BIZZASH_EMAIL_PRODUCT_URL:https://bizzy.biss-institute.com}
emailProductHost=${env.BIZZASH_EMAIL_PRODUCT_HOST:bizzy.biss-institute.com}
