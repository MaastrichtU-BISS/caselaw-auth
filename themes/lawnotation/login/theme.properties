# Lawnotation reuses the complete Case Law login implementation (including the
# passwordless OTP template, messages, footer and input script), then applies a
# small brand layer of its own. The theme is selected for the whole
# `lawnotation` realm, which also serves Baigle, so the copy stays
# product-neutral and only the look is Lawnotation's.
parent=caselaw
favicons=img/lawnotation-mark-v1.svg
styles=css/caselaw-login-v10.css css/lawnotation-login-v1.css
scripts=js/otp-input-v1.js

footerManagedBy=${env.LAWNOTATION_AUTH_FOOTER_MANAGED_BY:Authentication managed by BISS Institute}
footerBissLabel=${env.LAWNOTATION_AUTH_FOOTER_PRODUCT_LABEL:Lawnotation}
footerBissUrl=${env.LAWNOTATION_AUTH_FOOTER_PRODUCT_URL:https://www.lawnotation.org/}
footerLawTechLabel=${env.LAWNOTATION_AUTH_FOOTER_BISS_LABEL:BISS Institute}
footerLawTechUrl=${env.LAWNOTATION_AUTH_FOOTER_BISS_URL:https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society}
footerApiLabel=
footerApiUrl=

# Lawnotation's own documents. They must be set here, or the Case Law Explorer
# documents would be inherited from the parent theme. Lawnotation has no
# separate cookie policy. Another product in the realm (Baigle) shows its own
# documents by filling in its client's Terms of service URL and Policy URL.
legalTermsUrl=${env.LAWNOTATION_AUTH_TERMS_URL:https://app.lawnotation.org/terms-of-service}
legalPrivacyUrl=${env.LAWNOTATION_AUTH_PRIVACY_URL:https://app.lawnotation.org/privacy-policy}
legalCookiesUrl=${env.LAWNOTATION_AUTH_COOKIES_URL:}
