# The account console is a PatternFly single page app that Keycloak ships
# compiled, so this extends it rather than replacing it. Everything below is
# done through PatternFly's own custom properties, which means the restyle
# survives a Keycloak upgrade instead of fighting one: the variables are the
# supported surface, the class names underneath them are not.
parent=keycloak.v3
styles=css/caselaw-account.css

# Same footer strings as the login theme, from the same environment, so the two
# halves of signing in cannot drift apart.
footerManagedBy=${env.CASELAW_AUTH_FOOTER_MANAGED_BY:Authentication managed by BISS Institute}
