services:
  keycloak-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  keycloak:
    build:
      context: .
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
        MAGIC_LINK_VERSION: ${MAGIC_LINK_VERSION:-0.75}
    restart: unless-stopped
    depends_on:
      - keycloak-db
    expose:
      - "8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-false}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
      CASELAW_AUTH_FOOTER_BISS_LABEL: ${CASELAW_AUTH_FOOTER_BISS_LABEL:-BISS Institute}
      CASELAW_AUTH_FOOTER_BISS_URL: ${CASELAW_AUTH_FOOTER_BISS_URL:-https://www.maastrichtuniversity.nl/research/brightlands-institute-smart-society}
      CASELAW_AUTH_FOOTER_LAW_TECH_LABEL: ${CASELAW_AUTH_FOOTER_LAW_TECH_LABEL:-Maastricht University Law & Tech Lab}
      CASELAW_AUTH_FOOTER_LAW_TECH_URL: ${CASELAW_AUTH_FOOTER_LAW_TECH_URL:-https://www.maastrichtuniversity.nl/research/law-and-tech-lab}
      CASELAW_AUTH_FOOTER_API_LABEL: ${CASELAW_AUTH_FOOTER_API_LABEL:-Citations API}
      CASELAW_AUTH_FOOTER_API_URL: ${CASELAW_AUTH_FOOTER_API_URL:-https://demo-api.caselawexplorer.tech}

volumes:
  keycloak-db-data:
