[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biss-auth-server"
version = "0.3.1"
description = "Shared BISS server-side OIDC authentication, compatible with caselaw-auth-server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyjwt[crypto]>=2.8"]

[project.urls]
Repository = "https://github.com/MaastrichtU-BISS/caselaw-auth"

[tool.hatch.build.targets.wheel]
packages = ["src/biss_auth_server"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
