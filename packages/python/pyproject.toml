[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caselaw-auth-server"
version = "0.1.0"
description = "Server-side OIDC for Case Law Explorer products, interchangeable with the caselaw-auth npm package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyjwt[crypto]>=2.8"]

[project.urls]
Homepage = "https://github.com/MaastrichtU-BISS/caselaw-auth#readme"
Repository = "https://github.com/MaastrichtU-BISS/caselaw-auth"
Issues = "https://github.com/MaastrichtU-BISS/caselaw-auth/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/caselaw_auth_server"]
