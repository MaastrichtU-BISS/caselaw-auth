[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caselaw-auth-server"
version = "0.3.2"
description = "Deprecated package name: use biss-auth-server. Maintained compatibility wrapper for BISS Auth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["biss-auth-server==0.3.1"]

[project.urls]
Replacement = "https://pypi.org/project/biss-auth-server/"
Homepage = "https://github.com/MaastrichtU-BISS/caselaw-auth#readme"
Repository = "https://github.com/MaastrichtU-BISS/caselaw-auth"
Issues = "https://github.com/MaastrichtU-BISS/caselaw-auth/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/caselaw_auth_server"]
