name: Publish BISS Auth packages

on:
  push:
    tags: ["biss-npm-v*", "biss-python-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to validate or publish
        type: choice
        options: [npm, python]
        required: true
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: biss-release-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build pytest ./packages/python ./packages/python-biss
      - run: python -m pytest -q packages/python/tests packages/python-biss/tests
      - run: node packages/contract/conformance/interop.mjs "$(which python)"
      - run: npm run test:packages
      - run: python -m build packages/python-biss
      - run: npm audit --omit=dev
      - name: Validate selected tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json, os, tomllib
          tag = os.environ['TAG']
          if tag.startswith('biss-npm-v'):
              version = json.load(open('packages/biss-auth/package.json'))['version']
              expected = 'biss-npm-v' + version
          else:
              version = tomllib.load(open('packages/python-biss/pyproject.toml', 'rb'))['project']['version']
              expected = 'biss-python-v' + version
          if tag != expected:
              raise SystemExit(f'Tag {tag} does not match {expected}')
          PYTHON

  npm:
    needs: check
    if: startsWith(github.ref, 'refs/tags/biss-npm-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'npm' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        working-directory: packages/biss-auth

  python:
    needs: check
    if: startsWith(github.ref, 'refs/tags/biss-python-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'python' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build packages/python-biss
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-biss/dist
