name: Publish to npm

# Legacy npm releases retain their original v* tag convention.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check without publishing"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Lockfile lives at the workspace root, so the install happens there.
      - run: npm ci

      - name: Unit and contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # dist/ is not committed, so this is the only thing that proves the
      # published tarball can actually be produced.
      - name: Build
        run: npm run build

      - name: Verify the tarball contents
        run: npm pack --dry-run
        working-directory: packages/caselaw-auth

      - run: npm run test:packages

      - name: Reject production dependency advisories
        run: npm audit --omit=dev

  passwordless-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test fresh install, legacy upgrade, SMTP delivery and stale-user cleanup
        run: npm run test:e2e

  publish:
    needs: [check, passwordless-e2e]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Declaring any permission drops every default, so contents: read has to
      # be spelled out for actions/checkout.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./packages/caselaw-auth/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version but package.json says $pkg_version" >&2
            exit 1
          fi
          echo "Publishing caselaw-auth $pkg_version"

      # The package ships dist/ and nothing else, so it must be built here:
      # publishing without this step produces an empty tarball.
      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the standalone BISS release first
        run: python scripts/check-canonical-release.py npm

      # No NODE_AUTH_TOKEN: the OIDC identity is the credential, and npm
      # attaches provenance automatically for trusted publishes.
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish
        working-directory: packages/caselaw-auth
